<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<style>
  /* Colours mirror src/theme.rs so the page reads as part of the browser. */
  :root {
    --frame: #1c1d21;
    --field: #2b2d31;
    --field-hover: #313339;
    --divider: #3a3c42;
    --text: #e6e8ec;
    --text-weak: #9a9fa8;
    --accent: #7cacf8;
    --rust: #d0683f;
  }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--frame);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28vh 16px 0;
  }
  h1 {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 32px;
    font-size: 52px;
    font-weight: 600;
    letter-spacing: -1px;
  }
  .mark {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--rust);
  }
  form {
    width: 100%;
    max-width: 560px;
  }
  input {
    box-sizing: border-box;
    width: 100%;
    height: 48px;
    padding: 0 22px;
    border: 1px solid var(--divider);
    border-radius: 24px;
    background: var(--field);
    color: var(--text);
    font: inherit;
    font-size: 16px;
    outline: none;
  }
  input:hover { background: var(--field-hover); }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--text-weak); }
</style>
</head>
<body>
<main>
  <h1><span class="mark"></span>Ferrous</h1>
  <form action="https://duckduckgo.com/" method="get" role="search">
    <input name="q" type="search" placeholder="Search the web" aria-label="Search the web" autocomplete="off">
  </form>
</main>
</body>
</html>
